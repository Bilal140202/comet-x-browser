<!DOCTYPE html>
<!--
  Comet-X Transformers.js runtime host (v2.1.0).
  Served from https://appassets.androidplatform.net/assets/webllm/ via
  WebViewAssetLoader — a secure origin so Cache Storage can persist downloaded
  models across sessions. The native side injects COOP/COEP headers on this
  page (cross-origin isolation → SharedArrayBuffer → multi-threaded WASM).

  The page itself is a minimal status surface; all real work happens in
  runtime.js, driven by window.__cometxAI.handle(...) commands from Kotlin
  (see ai/web/WebLlmProtocol.kt for the wire contract).
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comet-X Web LLM</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: #0b0e14; color: #c9d4e3;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #mark { font-size: 20px; font-weight: 700; color: #7fb2ff; letter-spacing: .4px; }
  #state { font-size: 13px; opacity: .85; text-align: center; padding: 0 24px;
           min-height: 18px; font-variant-numeric: tabular-nums; }
  #bar { width: min(320px, 72vw); height: 4px; border-radius: 2px;
         background: #1d2430; overflow: hidden; visibility: hidden; }
  #fill { height: 100%; width: 0%; border-radius: 2px;
          background: linear-gradient(90deg, #4f8cff, #9db9ff); transition: width .2s; }
</style>
</head>
<body>
  <div id="mark">☄ Comet-X · in-browser AI</div>
  <div id="bar"><div id="fill"></div></div>
  <div id="state">starting runtime…</div>
  <script type="module" src="./runtime.js"></script>
</body>
</html>
